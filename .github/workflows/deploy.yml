name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is still also built from the branch with Jekyll, which turns README.md
      # into the homepage. Both deploys succeed, and the one that finishes last is
      # what visitors see. Wait that build out, then publish the portfolio over it.
      - uses: actions/checkout@v5

      - name: Wait out the Jekyll Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-pages-jekyll.sh

      - id: deployment
        uses: actions/deploy-pages@v4
