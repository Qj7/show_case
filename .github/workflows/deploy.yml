name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is still also built from the branch with Jekyll, which turns README.md
      # into the homepage. Both deploys succeed, and the one that finishes last is
      # what visitors see. Wait that build out, then publish the portfolio over it.
      - name: Wait out the Jekyll Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          start=$(date +%s)
          echo "Waiting so the README build cannot replace the portfolio."
          for i in $(seq 1 40); do
            if ! json=$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: show-case-deploy" \
              "https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&per_page=20"); then
              echo "Actions API unavailable."
              json=""
            fi
            state=$(printf '%s' "$json" | python3 -c '
import json, sys
raw = sys.stdin.read().strip()
if not raw:
    print("api-error")
    raise SystemExit
try:
    data = json.loads(raw)
except json.JSONDecodeError:
    print("api-error")
    raise SystemExit
runs = [r for r in data.get("workflow_runs", []) if r.get("name") == "pages build and deployment"]
if not runs:
    print("missing")
else:
    run = runs[0]
    print((run.get("status") or "unknown") + " " + (run.get("conclusion") or ""))
' || true)
            if [ -z "$state" ]; then
              state=api-error
            fi
            echo "attempt ${i}: ${state}"
            case "$state" in
              completed*)
                echo "Jekyll deploy finished. Pausing so it is live before we replace it."
                sleep 25
                exit 0
                ;;
            esac
            now=$(date +%s)
            if [ "$state" = "missing" ] || [ "$state" = "api-error" ]; then
              if [ $((now - start)) -ge 90 ]; then
                echo "No Jekyll deploy confirmed. Publishing now."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Stopped waiting. Publishing the portfolio."

      - id: deployment
        uses: actions/deploy-pages@v4
